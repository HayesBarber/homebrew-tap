name: Update rvw

on:
  repository_dispatch:
    types: [update_rvw]

permissions:
  contents: read

concurrency:
  group: update-rvw
  cancel-in-progress: false

jobs:
  update-rvw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RVW_APP_CLIENT_ID }}
          private-key: ${{ secrets.RVW_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Update the cask
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-rvw.py

      - name: Commit and push the cask
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- Casks/rvw.rb; then
            echo "The rvw cask is current. No commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/rvw.rb
          git commit -m "chore: update rvw cask"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag and release the cask update
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          export LATEST_TAG
          next_tag=$(python3 - <<'PY'
          import os
          import re
          import sys

          tag = os.environ["LATEST_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              sys.exit("Latest tap release must use vMAJOR.MINOR.PATCH")
          major, minor, _ = map(int, match.groups())
          print(f"v{major}.{minor + 1}.0")
          PY
          )
          git tag "$next_tag" "$COMMIT_SHA"
          git push origin "refs/tags/$next_tag"
          gh release create "$next_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$next_tag" \
            --generate-notes \
            --notes-start-tag "$LATEST_TAG" \
            --latest
