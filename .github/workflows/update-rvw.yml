name: Update rvw

on:
  repository_dispatch:
    types: [update_rvw]

permissions:
  contents: read

concurrency:
  group: update-rvw
  cancel-in-progress: false

jobs:
  update-rvw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RVW_APP_CLIENT_ID }}
          private-key: ${{ secrets.RVW_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Update the cask
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-rvw.py

      - name: Commit and push the cask
        shell: bash
        run: |
          if git diff --quiet -- Casks/rvw.rb; then
            echo "The rvw cask is current. No commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/rvw.rb
          git commit -m "chore: update rvw cask"
          git push origin HEAD:main
